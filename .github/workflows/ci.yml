name: CI

# Aynı depoda açılan dallarda hem push hem pull_request tetiklenip işlerin iki
# kez koşmaması için push yalnızca main ile sınırlandırıldı.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.8 imaja sabitlendi: actions/python-versions 3.8 için yalnızca
        # 24.04'e kadar build üretiyor. ubuntu-latest ileride 26.04'e
        # taşındığında bu iş sessizce kırılmasın. Diğer sürümlerde
        # ubuntu-latest kalır, böylece yeni imaj da denenmiş olur.
        include:
          - python-version: "3.8"
            os: ubuntu-24.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest

    steps:
      # Ayrıcalıklı bir sistem aracı olduğumuz için action'lar hareketli etiket
      # yerine commit SHA'sına sabitlendi: etiket yeniden işaretlense bile
      # çalışan kod değişmez. Yükseltirken yorumdaki sürümü de güncelleyin.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Bu iş akışı hiçbir şey itmiyor; token'ı .git/config içinde
          # bırakmayalım (fork PR'larında test kodu depo ile aynı adımda koşar).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  installer-syntax:
    name: Installer syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate installer shell syntax
        run: bash -n install.sh
