<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shield" x1="36" y1="256" x2="476" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ec5f0"/>
      <stop offset="1" stop-color="#3b7dfb"/>
    </linearGradient>
    <linearGradient id="flow" x1="100" y1="256" x2="424" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35c4ef"/>
      <stop offset="1" stop-color="#3b86fb"/>
    </linearGradient>
  </defs>

  <!-- shield body -->
  <path d="M256 26 L474 108 V266 C474 378 384 458 256 494 C128 458 38 378 38 266 V108 Z"
        fill="#111c2e" stroke="url(#shield)" stroke-width="22" stroke-linejoin="round"/>

  <!-- blocked / DPI wall -->
  <rect x="234" y="146" width="44" height="220" rx="12" fill="#cc3b45"/>

  <g fill="url(#flow)">
    <!-- top row -->
    <rect x="110" y="186" width="106" height="26" rx="13"/>
    <rect x="296" y="186" width="106" height="26" rx="13"/>
    <!-- bottom row -->
    <rect x="110" y="300" width="106" height="26" rx="13"/>
    <rect x="296" y="300" width="106" height="26" rx="13"/>
    <!-- middle row: passes straight through the wall -->
    <rect x="110" y="243" width="290" height="26" rx="13"/>
    <path d="M374 216 L438 256 L374 296 Z"/>
  </g>
